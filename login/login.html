<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - DinoRainPlay</title>
    <link rel="stylesheet" href="stylesheet.css">
    <script defer src="script.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="login-container">
        <h1>Login</h1>
        <form id="login-form">
            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <div class="password-container">
                    <input type="password" id="password" placeholder="Enter your password" required>
                    <i class="fas fa-eye" id="togglePassword"></i>
                </div>
            </div>
            <button type="submit" class="login-btn">Login</button>
            <p class="backhome-text"><a href="../index.html">Back to Home</a></p>
            <p>Don't have an account? <a href="../signup/signup.html">Sign up</a></p>
            <p>Forgot your password?<a href="../forgotpassword/forgotpassword.html">Reset password</a></p>
        </form>
    </div>
</body>
</html>
