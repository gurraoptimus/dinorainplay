<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DinoRainPlay Signup</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="signup-container">
        <h1>Sign up DinoRainPlay</h1>
        <form action="/signup" method="post">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>
            
            <label for="username">What should we call you?</label>
            <input type="text" id="username" name="username" required>
            
            <label for="dob">Date of birth:</label>
            <input type="date" id="dob" name="dob" required>
            
            <label for="gender">Gender:</label>
            <select id="gender" name="gender" required>
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="non-binary">Non-binary</option>
                <option value="other">Other</option>
                <option value="prefer-not-to-say">Prefer not to say</option>
            </select>
            <button type="submit">Sign Up</button>
            <button type="button" onclick="window.location.href = '../index.html';">Back to Home</button>
            <a><p>Already have an account? <a href="../login/login.html">Login</a></p>            
        </form>
    </div>
    <!-- Footer with Playback Controls -->
    <footer class="footer">
        <!-- Footer content here -->
    </footer>
</body>
</html>
